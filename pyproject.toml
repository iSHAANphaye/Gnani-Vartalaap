[project]
name = "vartalaap"
version = "0.1.0"
description = "Indic-Aware Hybrid Turn Detection Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "websockets>=13.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "numpy>=1.26.0",
    "silero-vad>=5.1",
    "datasets>=3.0.0",
    "soundfile>=0.12.1",
    "onnxruntime>=1.19.0",
    "onnx>=1.16.0",
    "transformers>=4.40.0",
    "torch",
    "torchaudio",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]
torchaudio = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
